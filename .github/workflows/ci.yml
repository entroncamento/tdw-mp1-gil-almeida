name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  repository_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx prettier --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: [lint, format, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: out/

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    needs: [lint, format, test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy_preview.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}

      - name: Generate safe branch alias
        id: branch_alias
        shell: bash
        run: |
          RAW_REF="${{ github.head_ref }}"
          SAFE_ALIAS=$(echo "$RAW_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c 1-50 | sed -E 's/-+$//g')
          echo "alias=$SAFE_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Deploy preview with Wrangler
        id: deploy_preview
        shell: bash
        run: |
          set -o pipefail
          OUTPUT=$(npx wrangler versions upload --preview-alias "${{ steps.branch_alias.outputs.alias }}" 2>&1)
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+' | head -n 1)
          fi
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Preview URL on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const issueNumber = context.issue.number;
            const body = previewUrl
              ? `🚀 **Preview Deployment Ready!**\n\n🔗 **Preview URL:** ${previewUrl}`
              : `⚠️ **Preview deployment completed**, but the preview URL could not be detected from the logs.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  lighthouse:
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.preview.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true

  ai-code-review:
    name: AI Code Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR diff
        id: pr_diff
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=100
          git diff "origin/${{ github.base_ref }}...HEAD" \
            -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)*.lock' \
            ':(exclude)out' \
            ':(exclude).next' \
            ':(exclude)coverage' \
            ':(exclude)dist' \
            > pr_diff.txt

          if [ ! -s pr_diff.txt ]; then
            git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              -- . \
              ':(exclude)package-lock.json' \
              > pr_diff.txt || true
          fi

      - name: Review code with Gemini and post comment
        uses: actions/github-script@v8
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        with:
          script: |
            const fs = require('fs');

            const apiKey = process.env.GEMINI_API_KEY;
            if (!apiKey) {
              core.warning('GEMINI_API_KEY secret is not configured. Skipping AI code review.');
              return;
            }

            let diff = '';
            if (fs.existsSync('pr_diff.txt')) {
              diff = fs.readFileSync('pr_diff.txt', 'utf8');
            }

            if (!diff || !diff.trim()) return;

            const MAX_DIFF_LENGTH = 60000;
            let truncatedDiff = diff.length > MAX_DIFF_LENGTH 
              ? diff.slice(0, MAX_DIFF_LENGTH) + '\n\n... [Diff truncado]' 
              : diff;

            const systemPrompt = `És um Tech Lead especialista em React/Next.js. Faz uma revisão de código rigorosa. Responde em Markdown (Português). Foca-te em: Resumo (Risco), Bugs, Boas Práticas e Clean Code.`;
            const userPrompt = "Revisão de código:\n\n```diff\n" + truncatedDiff + "\n```";

            const chosenModel = process.env.GEMINI_MODEL;
            core.info(`A submeter diff ao Gemini (${chosenModel})...`);

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${chosenModel}:generateContent?key=${apiKey}`;

            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemPrompt }] },
                contents: [{ role: 'user', parts: [{ text: userPrompt }] }],
                generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(`Erro na API (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            const reviewText = data?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!reviewText) throw new Error('Sem resposta da API.');

            const botIdentifier = '<!-- ai-code-review-bot -->';
            const commentBody = `${botIdentifier}\n## 🤖 Revisão de Código por IA (\`${chosenModel}\`)\n\n${reviewText}`;
            const issueNumber = context.payload.pull_request?.number || context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(botIdentifier));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existingComment.id, body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: commentBody
              });
            }

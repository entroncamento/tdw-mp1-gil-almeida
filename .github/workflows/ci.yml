name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
  schedule:
    - cron: "0 0 * * *"

# Default permissions are read-only. Jobs that comment on PRs opt in below.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npx prettier --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Production deployment is only allowed after an actual push to main.
  # Schedules and repository_dispatch still run the test jobs but never deploy.
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Contentful configuration
        shell: bash
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CONTENTFUL_SPACE_ID:-}" ]]; then
            echo "::error::CONTENTFUL_SPACE_ID is missing from GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "${CONTENTFUL_ACCESS_TOKEN:-}" ]]; then
            echo "::error::CONTENTFUL_ACCESS_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "Required Contentful secrets are present."

      - name: Build static site
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: out/

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploy previews only for trusted pull requests from this repository.
  # Secrets are not available to ordinary pull_request workflows from forks.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [lint, format, test]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy_preview.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Contentful configuration
        shell: bash
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CONTENTFUL_SPACE_ID:-}" ]]; then
            echo "::error::CONTENTFUL_SPACE_ID is missing from GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "${CONTENTFUL_ACCESS_TOKEN:-}" ]]; then
            echo "::error::CONTENTFUL_ACCESS_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          echo "Required Contentful secrets are present."

      - name: Build static site
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}

      - name: Generate safe branch alias
        id: branch_alias
        shell: bash
        env:
          RAW_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SAFE_ALIAS=$(printf '%s' "$RAW_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g' \
            | sed -E 's/^-+|-+$//g' \
            | cut -c 1-50 \
            | sed -E 's/-+$//g')

          if [[ -z "$SAFE_ALIAS" ]]; then
            SAFE_ALIAS="pr-${PR_NUMBER}"
          fi

          if [[ ! "$SAFE_ALIAS" =~ ^[a-z0-9-]{1,50}$ ]]; then
            echo "::error::Could not create a valid Cloudflare preview alias."
            exit 1
          fi

          echo "alias=$SAFE_ALIAS" >> "$GITHUB_OUTPUT"

      - name: Deploy preview with Wrangler
        id: deploy_preview
        shell: bash
        env:
          PREVIEW_ALIAS: ${{ steps.branch_alias.outputs.alias }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing from GitHub Actions variables/secrets."
            exit 1
          fi

          if ! OUTPUT=$(npx --yes wrangler versions upload --preview-alias "$PREVIEW_ALIAS" 2>&1); then
            echo "::error::Wrangler failed to upload the preview. Check the Cloudflare configuration and credentials."
            exit 1
          fi

          PREVIEW_URL=$(printf '%s\n' "$OUTPUT" \
            | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' \
            | head -n 1 || true)

          if [[ ! "$PREVIEW_URL" =~ ^https://[A-Za-z0-9.-]+\.workers\.dev$ ]]; then
            echo "::error::Could not detect a valid Cloudflare workers.dev preview URL."
            exit 1
          fi

          echo "Preview URL detected: $PREVIEW_URL"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Comment or update Preview URL on PR
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            if (!previewUrl) {
              throw new Error('Preview URL is missing; refusing to publish an empty comment.');
            }

            const marker = '<!-- preview-deployment-bot -->';
            const body = `${marker}\n🚀 **Preview Deployment Ready!**\n\n🔗 **Preview URL:** ${previewUrl}`;
            const issueNumber = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              console.log('Updated the existing preview comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body
              });
              console.log('Created the preview comment.');
            }

  lighthouse:
    if: needs.preview.outputs.url != ''
    needs: preview
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate preview URL
        shell: bash
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
        run: |
          set -euo pipefail
          if [[ ! "${PREVIEW_URL:-}" =~ ^https://[A-Za-z0-9.-]+\.workers\.dev$ ]]; then
            echo "::error::A valid preview URL was not produced."
            exit 1
          fi

      - name: Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.preview.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
